<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalhea's Notepad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <header class="bg-blue-900 border-b border-blue-800 shadow-lg px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md">
                <i class="fa-solid fa-note-sticky text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-white">Kalhea's Notepad</h1>
                <p class="text-xs text-blue-300">Expressing Ideas</p>
            </div>
        </div>
        <div class="text-sm bg-blue-950 px-4 py-2 rounded-lg border border-blue-800 text-blue-200">
            <i class="fa-solid fa-circle text-emerald-400 text-xs mr-2"></i>Welcome, Kalhea!
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <section class="lg:col-span-1 bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col">
            <h2 id="form-title" class="text-lg font-semibold text-blue-400 mb-4 flex items-center">
                <i class="fa-solid fa-pen-to-square mr-2"></i>Create New Note
            </h2>
            <form id="note-form" class="space-y-4 flex-1 flex flex-col">
                <input type="hidden" id="note-id">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Note Title</label>
                    <input type="text" id="title" required placeholder="Enter a descriptive title..." 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                </div>
                <div class="flex-1 flex flex-col">
                    <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Content</label>
                    <textarea id="content" required rows="6" placeholder="Write your thoughts or code snippets here..." 
                        class="w-full flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition resize-none"></textarea>
                </div>
                <div class="flex space-x-3 pt-2">
                    <button type="submit" id="save-btn" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 px-4 rounded-xl shadow-lg shadow-blue-600/20 transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-plus"></i><span>Save Note</span>
                    </button>
                    <button type="button" id="cancel-btn" onclick="resetForm()" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-300 py-2.5 px-4 rounded-xl transition">
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <section class="lg:col-span-2 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-200 flex items-center">
                    <i class="fa-solid fa-layer-group text-blue-400 mr-2"></i>Your Notes
                </h2>
                <span id="note-count" class="text-xs bg-slate-800 text-blue-400 font-medium px-3 py-1 rounded-full border border-slate-700">0 Notes</span>
            </div>

            <div id="notes-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 overflow-y-auto max-h-[calc(100vh-220px)] pr-2">
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
